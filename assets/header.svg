<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="50%" stop-color="#17102B"/>
      <stop offset="100%" stop-color="#061A2B"/>
    </linearGradient>

    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="50%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#00FFFF"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"
            fill="none"
            stroke="#00FFFF"
            stroke-opacity="0.08"
            stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>

  <rect width="1200" height="300" fill="url(#grid)"/>

  <path d="M0 250 Q300 190 600 235 T1200 210"
        fill="none"
        stroke="url(#neon)"
        stroke-width="3"
        filter="url(#glow)">
    <animate
      attributeName="stroke-dasharray"
      values="1,120;120,1;1,120"
      dur="5s"
      repeatCount="indefinite"/>
  </path>

  <g fill="#00FFFF" filter="url(#glow)">
    <circle cx="105" cy="70" r="3">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1090" cy="80" r="3">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="1000" cy="220" r="3">
      <animate attributeName="opacity"
               values="0.2;1;0.2"
               dur="3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="180" cy="220" r="3">
      <animate attributeName="opacity"
               values="1;0.2;1"
               dur="2.2s"
               repeatCount="indefinite"/>
    </circle>
  </g>

  <g stroke="#8A2BE2" stroke-opacity="0.35" stroke-width="1">
    <line x1="105" y1="70" x2="250" y2="120"/>
    <line x1="1090" y1="80" x2="950" y2="125"/>
    <line x1="1000" y1="220" x2="900" y2="160"/>
    <line x1="180" y1="220" x2="280" y2="165"/>
  </g>

  <text x="600"
        y="125"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="48"
        font-weight="700"
        fill="white"
        letter-spacing="3">
    DIVYA DHARSHINI S
  </text>

  <rect x="300"
        y="145"
        width="600"
        height="3"
        rx="2"
        fill="url(#neon)"
        filter="url(#glow)"/>

  <text x="600"
        y="185"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="21"
        fill="#00FFFF"
        letter-spacing="2">
    ARTIFICIAL INTELLIGENCE &amp; DATA SCIENCE
  </text>

  <text x="600"
        y="225"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="14"
        fill="#B8C4D6"
        letter-spacing="4">
    MACHINE LEARNING  •  COMPUTER VISION  •  AI
  </text>

  <circle cx="55" cy="150" r="18"
          fill="none"
          stroke="#8A2BE2"
          stroke-width="2"
          opacity="0.7"/>

  <circle cx="1145" cy="150" r="18"
          fill="none"
          stroke="#00FFFF"
          stroke-width="2"
          opacity="0.7"/>
</svg>
